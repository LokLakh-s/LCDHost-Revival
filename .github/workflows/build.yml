name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libhidapi-dev libgl1-mesa-dev libxkbcommon-x11-0

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Configure
        run: mkdir build && cd build && qmake ../LCDHost.pro -r

      - name: Build
        run: make -C build -j"$(nproc)"

      - name: Bundle layouts
        run: cp -r layouts build/LCDHost.app/

      - name: Smoke test
        run: tests/smoke/run.sh build/LCDHost.app/bin 20

      - name: HID unit tests
        run: mkdir build-tests && cd build-tests && qmake ../tests/hid/tst_hid.pro && make -j"$(nproc)" && ./tst_hid

      - name: Simulated Logitech devices
        run: tests/hid/run-fake-devices.sh build/LCDHost.app/bin 15

      # The version of the AppImage: LH_VERSION, plus the commit outside tags.
      - name: Build AppImage
        run: |
          version=$(sed -n 's/^ *LH_VERSION=//p' qmakecache/qmakecache.pro)
          [ "$GITHUB_REF_TYPE" = tag ] || version="$version-${GITHUB_SHA::7}"
          packaging/linux/build-appimage.sh build/LCDHost.app "$version" appimage

      - name: AppImage smoke test
        run: |
          mkdir appimage-test && cd appimage-test
          ../appimage/LCDHost-*-x86_64.AppImage --appimage-extract > /dev/null
          cd .. && tests/smoke/run.sh appimage-test/squashfs-root/AppRun 20

      - uses: actions/upload-artifact@v7
        with:
          name: LCDHost-linux-x64
          path: build/LCDHost.app

      - uses: actions/upload-artifact@v7
        with:
          name: LCDHost-linux-x64-appimage
          path: appimage/LCDHost-*-x86_64.AppImage

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # aqtinstall (used by install-qt-action) cannot install Qt 6.11+ on
      # Windows yet: Qt changed its repository layout. Stay on 6.10 there.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      # libusb, hidapi and libwdi at pinned versions (checked by SHA-256).
      - name: Fetch dependencies
        shell: pwsh
        run: packaging/windows/fetch-deps.ps1 -Destination "$env:RUNNER_TEMP\deps"

      - name: Configure
        shell: cmd
        run: mkdir build && cd build && qmake ..\LCDHost.pro -r

      - name: Build
        shell: cmd
        run: cd build && nmake /NOLOGO

      - name: Bundle Qt runtime and layouts
        shell: cmd
        run: |
          windeployqt --release --no-translations build\LCDHost.app\bin\LCDHost.exe
          windeployqt --release --no-translations build\LCDHost.app\bin\WebKitServer.exe
          xcopy /E /I /Y layouts build\LCDHost.app\layouts
          del /Q build\LCDHost.app\bin\*.lib build\LCDHost.app\bin\*.exp

      # Starts the bundled build headless and checks it is still running after
      # 20 s (plugin loading is covered by the Linux smoke test).
      - name: Smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath build\LCDHost.app\bin\LCDHost.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "LCDHost exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Output 'OK: LCDHost ran 20s'

      # Runs the elevated installer for real: the runner is an administrator
      # and a throwaway machine.
      - name: Driver installer test
        shell: pwsh
        run: tests/driver-setup/run.ps1 build\LCDHost.app\bin\LCDHostDriverSetup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: LCDHost-windows-x64
          path: build/LCDHost.app

  # A pushed "v*" tag publishes a GitHub release with both builds. The tag
  # must match LH_VERSION and have a section in CHANGELOG.md.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: packaging/release/package.sh "${GITHUB_REF_NAME#v}" artifacts release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "LCDHost ${GITHUB_REF_NAME#v}" --notes-file release/notes.md \
            release/LCDHost-*.zip release/LCDHost-*.tar.gz release/LCDHost-*.AppImage \
            release/SHA256SUMS
